# fly.toml
app = "openpapr"
primary_region = "sin"
# A cushion for short memory spikes (a big deck rendering while LibreOffice
# converts) instead of an out-of-memory kill. Top-level: it must come before
# the first [table].
swap_size_mb = 512
[build]
[env]
  DATABASE_PATH = "/data/openpapr.db"
  # Dates and times are shown as the students live them, not in UTC.
  TZ = "Asia/Singapore"
[mounts]
  source = "openpapr_data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  # One machine is kept warm: with 0, Fly stopped it after a few idle minutes
  # and the next visit waited ~5s for a cold start. Staying up costs a few
  # dollars a month; set this back to 0 to let it sleep (opening the app then
  # syncs straight away, and long work keeps it up: src/worker/keep-awake.ts).
  # "stop" rather than "suspend": suspend can't be used with swap.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # The web server and its database; the worker's state is in the body only
  # (see src/app/api/health/route.ts).
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Pinned so a deploy can't silently pick a larger (costlier) machine.
# 1GB is the floor: this container runs both the Next server and the tsx
# worker, and the slide-render path retains ~400MB natively.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
