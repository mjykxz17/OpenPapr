# fly.toml
app = "openpapr"
primary_region = "sin"
[build]
[env]
  DATABASE_PATH = "/data/openpapr.db"
[mounts]
  source = "openpapr_data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # worker must keep polling
  min_machines_running = 1
