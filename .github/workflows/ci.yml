name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing; cancel it and keep the queue honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build can load config. SECRET_KEY must be 64 hex chars.
      SECRET_KEY: abababababababababababababababababababababababababababababababab
      APP_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`: npm records some nested platform-specific
      # optional deps (esbuild's per-OS binaries) without their optional flag,
      # so `npm ci` either demands an AIX binary on Linux or calls the lock
      # out of sync. `npm install` resolves per-platform correctly. The cost is
      # that CI is not bit-reproducible against the lock; the gates below still
      # verify the code.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
